components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Код ошибки (машиночитаемый идентификатор)
          example: VALIDATION_ERROR
        message:
          type: string
          description: Человекочитаемое описание ошибки
          example: Поле projectCode обязательно
        details:
          type: object
          description: Дополнительные данные об ошибке (необязательно)
          additionalProperties: true
      description: Унифицированный ответ при ошибке
    LogRecord:
      type: object
      required:
        - localTime
      description: Запись журнала из таблицы logs_db.app_logs Scalar-поля соответствуют колонкам таблицы; Map-поля содержат произвольные атрибуты.
      additionalProperties: true
      properties:
        snowLogId:
          type: integer
          format: int64
          description: Монотонный уникальный идентификатор записи (Snowflake ID)
        localTime:
          type: string
          format: date-time
          description: Временная метка события с точностью до наносекунды (DateTime64(9))
          example: '2024-01-15T12:34:56.123456789Z'
        timeBucket10s:
          type: string
          format: date-time
          description: Округление localTime до 10-секундного интервала (материализованная колонка)
        projectCode:
          type: string
          description: Код проекта (LowCardinality)
        risCode:
          type: string
          description: Код РИС (LowCardinality)
        appType:
          type: string
          description: Тип приложения (LowCardinality)
          example: NET
        level:
          type: string
          description: Уровень логирования (LowCardinality)
          example: ERROR
        appName:
          type: string
          description: Имя приложения (LowCardinality)
        levelInt:
          type: integer
          format: int32
          description: Числовое значение уровня логирования
        text:
          type: string
          description: Текст сообщения лога
        stack:
          type: string
          description: Стектрейс исключения
        error:
          type: string
          description: Краткое описание ошибки
        namespace:
          type: string
          description: Kubernetes namespace
        source_type:
          type: string
          description: Источник лога
        hostAddress:
          type: string
          description: IP-адрес хоста
        hostName:
          type: string
          description: Имя хоста
        podName:
          type: string
          description: Имя Kubernetes pod
        traceId:
          type: string
          description: Идентификатор трассировки (distributed tracing)
        eventId:
          type: string
          description: Идентификатор события
        messageId:
          type: string
          description: Уникальный идентификатор сообщения
        callId:
          type: string
          description: Идентификатор вызова
        extEventId:
          type: string
          description: Внешний идентификатор события
        spanId:
          type: string
          description: Идентификатор span (distributed tracing)
        requestId:
          type: string
          description: Идентификатор HTTP-запроса
    LogQueryPageableRequest:
      required:
        - pageAttributes
        - filters
      type: object
      properties:
        fields:
          type: array
          description: Массив полей для получения
          items:
            type: string
        sort:
          $ref: '#/components/schemas/SortAttributes'
        filters:
          $ref: '#/components/schemas/Filters'
        pageAttributes:
          $ref: '#/components/schemas/ClickHouseAttributes'
    SortAttributes:
      required:
        - order
      type: object
      properties:
        order:
          pattern: ^asc|desc$
          type: string
          description: Порядок сортировки (asc/desc)
        fieldName:
          type: string
          description: Поле сортировки
    Filters:
      required:
        - mainTimeFilter
      type: object
      properties:
        luceneQuery:
          type: string
          description: >-
            Full-text поиск по полю text.
            Поддерживает операторы AND, OR, NOT и фразовый поиск в кавычках.
            Пример: "exception AND (timeout OR connection)"
        mainTimeFilter:
          $ref: '#/components/schemas/LogQueryRequest'
        fieldFilters:
          type: array
          description: Массив фильтров для атрибутов
          items:
            $ref: '#/components/schemas/ClickHouseFilters'
      description: Атрибуты к запросу в оперативное хранилище и все возможные фильтры
    ClickHouseAttributes:
      required:
        - limit
      type: object
      properties:
        limit:
          minimum: 1
          type: integer
          description: Кол-во сообщений для отображения
          format: int32
        cursors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Cursor'
          description: >-
            Карта указателей для каждого сегмента на последнюю запись для
            постраничной пагинации
    ClickHouseResponse:
      type: object
      properties:
        payload:
          type: array
          description: Список сообщений
          items:
            $ref: '#/components/schemas/LogRecord'
        cursor:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Cursor'
          description: Информация о курсоре
    Cursor:
      required:
        - id
        - score
      type: object
      properties:
        sortingFieldValue:
          type: object
          description: sorting field value of last record
        id:
          type: object
          description: id of last record
      description: >-
        Карта указателей для каждого сегмента на последнюю запись для
        постраничной пагинации
    LogQueryRequest:
      required:
        - endTime
        - startTime
      type: object
      properties:
        startTime:
          type: string
          format: date-time
          example: '2022-01-01T00:00:00Z'
        endTime:
          type: string
          format: date-time
          example: '2022-01-01T00:00:00Z'
      description: This model represents available fields to query in Hive or ClickHouse
    ClickHouseFilters:
      required:
        - attributeName
      type: object
      properties:
        filterOperator:
          type: string
          description: Оператор фильтра (список значений)
          enum:
            - IS
            - IS NOT
            - IS ONE OF
            - IS NOT ONE OF
            - EXIST
            - DOES NOT EXIST
            - CONTAINS
            - NOT CONTAINS
            - "<"
            - ">"
            - ">="
            - "<="
        attributeName:
          maxLength: 2147483647
          minLength: 1
          type: string
          description: Наименование атрибута
        attributeValue:
          uniqueItems: true
          type: array
          description: Значение атрибута (массив строк)
          items:
            type: string
            description: Значение атрибута (массив строк)
      description: Атрибуты к запросу в оперативное хранилище
    ClickHouseAggregationRequest:
      required:
        - filters
      type: object
      properties:
        aggregationType:
          type: string
          enum:
            - histogram
            - top-n
          description: Тип агрегации, получаемых данных
        aggregationAttributes:
          $ref: '#/components/schemas/LogStatRequest'
        filters:
          $ref: '#/components/schemas/Filters'
      description: Атрибуты к запросу в оперативное хранилище
    ClickHouseAggregationResponse:
      type: object
      properties:
        aggregationResult:
          type: object
          properties:
            interval:
              type: string
              description: Интервал бакета
              example: PT5M
            buckets:
              type: array
              description: Список бакетов для представления объема логов в гистограмме
              items:
                $ref: '#/components/schemas/Bucket'
    LogStatRequest:
      type: object
      properties:
        fieldName:
          maxLength: 2147483647
          minLength: 1
          type: string
          description: Наименование атрибута
        limit:
          minimum: 1
          type: integer
          description: Кол-во значений для отображения
          format: int32
        dateHistogramInterval:
          type: string
          description: Интервал для гистограммы объема сообщений по дате
          enum:
            - auto
            - millisecond
            - second
            - minute
            - hour
            - day
            - week
            - month
      description: Атрибуты к запросу в оперативное хранилище и все возможные фильтры
    Bucket:
      required:
        - docCount
        - key
        - keyAsString
      type: object
      properties:
        docCount:
          type: integer
          description: Количество сообщений лога в бакете
          format: int64
        key:
          type: integer
          description: Время бакета, timestamp
          format: int64
        keyAsString:
          type: string
          description: Время бакета, представление в виде строки
        parts:
          type: array
          description: Массив сегментов (bucket) с данными агрегации
          items:
            $ref: '#/components/schemas/AggregatedItems'
      description: Бакет с количеством сообщений лога за время
    AggregatedItems:
      required:
        - value
        - docCount
      type: object
      properties:
        value:
          type: string
          description: Значение поля
          example: firstApp
        docCount:
          type: integer
          description: Количество документов для данного значения
    LogQueryLogExportRequest:
      type: object
      required:
        - filters
      properties:
        exportAttributes:
          $ref: '#/components/schemas/ExportAttributes'
        filters:
          $ref: '#/components/schemas/Filters'
      description: Запрос на получение наиболее часто встречающихся значений поля
    ExportAttributes:
      required:
        - fieldName
        - limit
      type: object
      properties:
        fileType:
          type: string
          enum:
              - csv
              - txt
          description: (уточнить) Тип выгружаемого файла
        sorting:
          $ref: '#/components/schemas/SortAttributes'
        limitLines:
          minimum: 1
          type: integer
          description: Кол-во логов для выгрузки
          format: int32
        limitMB:
          minimum: 1
          type: integer
          description: Объем файла выгрузки в Мб
          format: int32
        exportFields:
          type: array
          items:
            maxLength: 2147483647
            minLength: 1
            type: string
            description: Наименование атрибута
          description: Атрибуты к запросу в оперативное хранилище и все возможные фильтры
    LogQueryFilterStatRequest:
      required:
        - filters
      type: object
      properties:
        statAttributes:
          $ref: '#/components/schemas/LogStatRequest'
        filters:
          $ref: '#/components/schemas/Filters'
      description: Запрос на получение наиболее часто встречающихся значений поля
    FieldAggregationResponse:
      type: object
      required:
        - fieldName
        - totalDocCount
        - buckets
      properties:
        fieldName:
          maxLength: 2147483647
          minLength: 1
          type: string
          description: Наименование атрибута
        values:
          type: array
          description: Массив сегментов (bucket) с данными агрегации
          items:
            $ref: '#/components/schemas/AggregatedItems'
    FormData:
      type: object
      properties:
        fields:
          type: array
          description: Базовые поля фильтра
          items:
            $ref: '#/components/schemas/Field'
    Field:
      type: object
      properties:
        name:
          type: string
          description: Название поля
        controlType:
          type: string
          description: Тип элемента управления для поля
          enum:
            - select
            - datetime
            - text
            - longText
            - number
            - id
            - hidden
        description:
          type: string
          description: Описание поля
        options:
          type: array
          description: Список возможных значений поля
          items:
            type: string
            description: Список возможных значений поля
      description: Объект с данными для поля фильтра
    ConstraintResponse:
      required:
        - maxIntervalCold
        - maxIntervalHot
      type: object
      properties:
        maxIntervalHot:
          type: integer
          description: Максимальное количество дней хранения в горячем хранилище
          format: int32
          example: 5
        maxIntervalCold:
          type: integer
          description: Максимальное количество дней хранения в холодном хранилище
          format: int32
          example: 10
    SavedSearchItemGetResult:
      required:
        - id
        - name
        - primaryTerm
        - seqNo
        - version
      type: object
      properties:
        id:
          type: string
          description: Уникальный идентификатор
        version:
          type: integer
          description: Версия записи
          format: int64
        seqNo:
          type: integer
          description: >-
            ClickHouse может использовать порядковый номер операций, чтобы
            убедиться, что более новая версия документа никогда не будет
            отменена изменением, которому присвоен меньший порядковый номер.
          format: int64
        primaryTerm:
          type: integer
          description: >-
            Первичный термин для группы репликации - это просто счетчик того,
            сколько раз менялся первичный шард.
          format: int64
        author:
          type: string
          description: VTB ID сотрудника, сохранившего запись
        authorRoles:
          type: array
          description: Роли сотрудника сохранившего запись
          items:
            type: string
            description: Роли сотрудника сохранившего запись
        name:
          type: string
          description: Имя профиля поиска
        onlyMy:
          type: boolean
          description: >-
            true - личный фильтр для текущего пользователем, false -
            проектный/публичный фильтр
        apply:
          type: boolean
          description: >-
            true - текущему пользователю доступна возможность применения профиля
            поиска, false - текущему пользователю не доступна возможность
            применения профиля поиска
        share:
          type: boolean
          description: >-
            true - текущему пользователю доступна команда "Поделиться", false -
            текущему пользователю не доступна команда "Поделиться"
        delete:
          type: boolean
          description: >-
            true - текущему пользователю доступна возможность удаления профиля
            поиска, false - текущему пользователю не доступна возможность
            удаления профиля поиска
        storageType:
          type: string
          enum:
            - hot
            - cold
            - syslogs
        startTime:
          type: string
          format: date-time
          example: '2022-01-01T00:00:00Z'
        endTime:
          type: string
          format: date-time
          example: '2022-01-01T00:00:00Z'
        filters:
          type: array
          description: Массив фильтров для атрибутов
          items:
            $ref: '#/components/schemas/SavedSearchFilter'
      description: Описание профиля поиска
    SavedSearchFilter:
      required:
        - attributeName
        - attributeValue
      type: object
      properties:
        filterOperator:
          type: string
          description: Оператор фильтра (список значений)
          enum:
            - IS
            - IS NOT
            - IS ONE OF
            - IS NOT ONE OF
            - EXIST
            - DOES NOT EXIST
        attributeName:
          type: string
          description: Наименование атрибута
        attributeValue:
          uniqueItems: true
          type: array
          description: Значение атрибута (массив строк)
          items:
            type: string
            description: Значение атрибута (массив строк)
        attributeVisibility:
          type: boolean
          description: Видимость атрибута
      description: Атрибуты профиля поиска
    EditSavedSearchRequest:
      required:
        - name
        - primaryTerm
        - seqNo
      type: object
      properties:
        seqNo:
          type: integer
          description: >-
            ClickHouse может использовать порядковый номер операций, чтобы
            убедиться, что более новая версия документа никогда не будет
            отменена изменением, которому присвоен меньший порядковый номер.
          format: int64
        primaryTerm:
          type: integer
          description: >-
            Первичный термин для группы репликации - это просто счетчик того,
            сколько раз менялся первичный шард.
          format: int64
        name:
          maxLength: 500
          minLength: 3
          type: string
          description: >-
            Имя профиля поиска (должно быть уникально в пределах списка
            projectCode)
        filters:
          type: array
          description: Массив фильтров для атрибутов
          items:
            $ref: '#/components/schemas/Filters'
      description: Описание существующего профиля поиска
    SavedSearchAttributesRequest:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
          example: '2022-01-01T00:00:00Z'
        endTime:
          type: string
          format: date-time
          example: '2022-01-01T00:00:00Z'
      description: This model represents available fields to query in Hive or ClickHouse
    SavedSearchEditResult:
      required:
        - primaryTerm
        - seqNo
        - version
      type: object
      properties:
        version:
          type: integer
          description: Версия записи
          format: int64
        seqNo:
          type: integer
          description: >-
            ClickHouse может использовать порядковый номер операций, чтобы
            убедиться, что более новая версия документа никогда не будет
            отменена изменением, которому присвоен меньший порядковый номер.
          format: int64
        primaryTerm:
          type: integer
          description: >-
            Первичный термин для группы репликации - это просто счетчик того,
            сколько раз менялся первичный шард.
          format: int64
      description: Результат редактирования профиля поиска
    SavedSearchAttributes:
      required:
        - limit
      type: object
      properties:
        limit:
          minimum: 1
          type: integer
          description: Кол-во сообщений для отображения
          format: int32
        cursor:
          $ref: '#/components/schemas/SavedSearchCursor'
      description: Атрибуты к запросу в оперативное хранилище
    SavedSearchCursor:
      required:
        - id
        - score
      type: object
      properties:
        score:
          type: string
          description: score of last record
        id:
          type: string
          description: id of last record
      description: Указатель на последнюю запись для постраничной пагинации
    SavedSearchGetResult:
      type: object
      properties:
        savedSearchItems:
          type: array
          items:
            $ref: '#/components/schemas/SavedSearchItemGetResult'
        cursor:
          $ref: '#/components/schemas/SavedSearchCursor'
      description: Описание профилей поиска и карта курсоров для навигации по сегментам
    NewSavedSearchRequest:
      required:
        - filters
        - name
      type: object
      properties:
        name:
          maxLength: 500
          minLength: 3
          type: string
          description: >-
            Имя профиля поиска (должно быть уникально в пределах списка
            projectCode)
        onlyMy:
          type: boolean
          description: >-
            true - личный фильтр для текущего пользователем, false -
            проектный/публичный фильтр
          default: false
        filters:
          type: array
          description: Массив фильтров для атрибутов
          items:
            $ref: '#/components/schemas/Filters'
      description: Описание нового профиля поиска
    SavedSearchCreateResult:
      required:
        - id
        - primaryTerm
        - seqNo
        - version
      type: object
      properties:
        id:
          type: string
          description: Уникальный идентификатор
        version:
          type: integer
          description: Версия записи
          format: int64
        seqNo:
          type: integer
          description: >-
            ClickHouse может использовать порядковый номер операций, чтобы
            убедиться, что более новая версия документа никогда не будет
            отменена изменением, которому присвоен меньший порядковый номер.
          format: int64
        primaryTerm:
          type: integer
          description: >-
            Первичный термин для группы репликации - это просто счетчик того,
            сколько раз менялся первичный шард.
          format: int64
      description: Результат создания нового профиля поиска
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
