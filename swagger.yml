          required: true
          schema:
            type: string
        - name: storageType
          in: path
          description: >-
            Тип хранилища (hot - ClickHouse; cold - в Hadoop; syslogs - в
            Hadoop, в таблице syslogs)
          required: true
          schema:
            type: string
            enum:
              - hot
              - cold
              - syslogs
      responses:
