          in: query
          description: >-
            true - выдается список поисков, которые были сохранены текущим
            пользователем, false - видимые ролью
          required: true
          schema:
            type: boolean
            default: false
        - name: attributes
          in: query
          description: Дополнительные аттрибуты для поиска
          required: true
