      summary: Возвращает список профилей поиска, видимых текущей ролью
      operationId: getAllSavedSearches
      parameters:
        - name: storageType
          in: path
          description: >-
            Тип хранилища (hot - ClickHouse; cold - в Hadoop; syslogs - в
            Hadoop, в таблице syslogs)
          required: true
